# Mantiene despierta la API en Render (plan free: se duerme tras ~15 min sin
# tráfico y la primera carga tarda ~20 s).
#
# OJO: GitHub NO garantiza la puntualidad de los workflows programados.
# Con carga alta las ejecuciones de `schedule` pueden demorarse varios minutos
# o incluso saltearse, así que puede haber algún arranque en frío igual.
# Además, GitHub desactiva los schedules de repos públicos sin actividad
# durante 60 días (hay que reactivarlo desde la pestaña Actions).
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        # /health no toca la base: solo despierta el servicio.
        run: curl -fsS --max-time 60 --retry 2 --retry-delay 5 https://sistema-industrial-api.onrender.com/health
